apiVersion: apps/v1
kind: Deployment
metadata:
  name: quickbite-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: quickbite

  template:
    metadata:
      labels:
        app: quickbite

    spec:
      containers:
        - name: quickbite-container
          image: hibahtaj/quickbite:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 5000