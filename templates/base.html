<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuickBite | {% block title %}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav><a class="brand" href="{{ url_for('home') }}">🍽 QuickBite</a><div><a href="{{ url_for('home') }}">Home</a><a href="{{ url_for('menu') }}">Menu</a><a href="{{ url_for('cart') }}">Cart 🛒</a></div></nav>
  <main>{% with messages = get_flashed_messages() %}{% for message in messages %}<p class="notice">{{ message }}</p>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main>
  <footer>QuickBite • A simple Flask DevOps case study</footer>
</body>
</html>
