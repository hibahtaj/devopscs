{% extends 'base.html' %}{% block title %}Menu{% endblock %}{% block content %}
<header class="page-heading"><span class="badge">Something for every craving</span><h1>Our Menu</h1><p>Choose your favourites and add them to your cart.</p></header>
<div class="grid">{% for item in items %}<article class="card"><div class="food-icon">{{ item.emoji }}</div><h2>{{ item.name }}</h2><p class="price">₹{{ item.price }}</p><form method="post" action="{{ url_for('add_to_cart', item_id=item.id) }}"><button type="submit">+ Add to Cart</button></form></article>{% endfor %}</div>
{% endblock %}
